<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" width="700" height="1000">
  <defs>
    <!-- Stage Crimson Neon Glow Filter -->
    <filter id="concertGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#e11d2e" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="25" flood-color="#ff2a3b" flood-opacity="0.5"/>
    </filter>

    <filter id="pickGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff3344" flood-opacity="1"/>
    </filter>

    <!-- Stage Black Gradient with Deep Indigo-Charcoal Undertone -->
    <linearGradient id="bodyBlackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181420" />
      <stop offset="45%" stop-color="#0d0a13" />
      <stop offset="100%" stop-color="#060509" />
    </linearGradient>

    <!-- Crimson Burst Electric Guitar Body Gradient -->
    <radialGradient id="guitarBurst" cx="45%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e11d2e" />
      <stop offset="35%" stop-color="#990b17" />
      <stop offset="70%" stop-color="#3d0309" />
      <stop offset="100%" stop-color="#0a0204" />
    </radialGradient>

    <!-- Chrome Metallic Hardware Gradient -->
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7" />
      <stop offset="50%" stop-color="#8e9299" />
      <stop offset="100%" stop-color="#e0e3e8" />
    </linearGradient>

    <!-- Rim Light Gradient -->
    <linearGradient id="rimGlowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3344" stop-opacity="0.9" />
      <stop offset="20%" stop-color="#ff1122" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff1122" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g id="guitarist-centerpiece">
    <!-- 1. Ambient Stage Backlight Aura Flare -->
    <ellipse cx="360" cy="480" rx="260" ry="380" fill="url(#guitarBurst)" opacity="0.18" filter="url(#concertGlow)"/>

    <!-- 2. WIDE ROCK POWER STANCE LEGS & COMBAT PLATFORM BOOTS -->
    <!-- Left Leg (Forward Stance) -->
    <path d="M 290 560 L 260 760 L 240 880 L 210 900 L 195 940 L 295 940 L 305 900 L 310 760 L 340 570 Z" 
          fill="url(#bodyBlackGrad)" stroke="#e11d2e" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Left Knee Rip & Stage Denim Texture -->
    <path d="M 250 730 Q 265 740 280 730" fill="none" stroke="#e11d2e" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M 248 740 Q 265 750 282 740" fill="none" stroke="#2a2436" stroke-width="2"/>
    <!-- Left Boot Platform Sole & Metal Buckles -->
    <path d="M 190 925 L 295 925 L 295 945 L 190 945 Z" fill="#020104" stroke="#ff3344" stroke-width="1.5"/>
    <rect x="215" y="885" width="22" height="6" rx="2" fill="url(#metalChrome)"/>

    <!-- Right Leg (Back Power Stance) -->
    <path d="M 380 560 L 420 750 L 445 870 L 435 900 L 445 940 L 535 940 L 530 900 L 495 750 L 435 560 Z" 
          fill="url(#bodyBlackGrad)" stroke="#e11d2e" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Right Knee Rip & Denim Seams -->
    <path d="M 430 730 Q 445 740 460 730" fill="none" stroke="#e11d2e" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Right Boot Platform Sole -->
    <path d="M 435 925 L 540 925 L 540 945 L 435 945 Z" fill="#020104" stroke="#ff3344" stroke-width="1.5"/>
    <rect x="455" y="885" width="22" height="6" rx="2" fill="url(#metalChrome)"/>

    <!-- 3. TORSO, HOODIE & LEATHER JACKET WITH PUNK STUDS -->
    <path d="M 270 270 Q 230 380 240 500 Q 250 580 300 590 L 420 590 Q 465 570 460 480 Q 450 360 420 270 Z" 
          fill="url(#bodyBlackGrad)" stroke="#e11d2e" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Leather Jacket Collar & Lapels -->
    <path d="M 285 270 L 330 360 L 315 410 L 260 330 Z" fill="#1b1624" stroke="#332a42" stroke-width="1.5"/>
    <path d="M 405 270 L 360 360 L 375 410 L 430 330 Z" fill="#1b1624" stroke="#332a42" stroke-width="1.5"/>
    <!-- Metal Studs on Lapels -->
    <circle cx="280" cy="300" r="2.5" fill="url(#metalChrome)"/>
    <circle cx="295" cy="330" r="2.5" fill="url(#metalChrome)"/>
    <circle cx="310" cy="360" r="2.5" fill="url(#metalChrome)"/>
    <circle cx="410" cy="300" r="2.5" fill="url(#metalChrome)"/>
    <circle cx="395" cy="330" r="2.5" fill="url(#metalChrome)"/>
    <circle cx="380" cy="360" r="2.5" fill="url(#metalChrome)"/>

    <!-- GUITAR STRAP across chest -->
    <path d="M 285 270 L 415 540 L 380 555 L 255 285 Z" fill="#14111c" stroke="#ff2a3b" stroke-width="1" stroke-opacity="0.5"/>

    <!-- 4. HEAD, JAWLINE & ICONIC SWOOP EMO ROCK HAIR -->
    <!-- Neck -->
    <path d="M 330 260 L 365 260 L 370 210 L 335 210 Z" fill="#1e1824"/>
    
    <!-- Face Silhouette (Side-profile tilted intently down to fretboard) -->
    <path d="M 340 190 Q 325 215 340 240 L 365 235 Q 365 210 355 190 Z" fill="#1e1824" stroke="#ff3344" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Iconic Layered Emo Swoop Bangs & Spiky Rock Crown -->
    <!-- Spiky Crown / Back of Head -->
    <path d="M 350 110 L 380 90 L 375 125 L 410 115 L 395 150 L 425 155 L 400 185 L 415 210 L 385 215" 
          fill="#0a0810" stroke="#ff2a3b" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Sweeping Emo Bangs Over Face -->
    <path d="M 320 110 C 270 140 280 230 330 270 C 310 245 305 200 335 170 C 350 155 365 140 375 120 C 355 110 335 110 320 110 Z" 
          fill="#060509" stroke="#e11d2e" stroke-width="2.5" filter="url(#concertGlow)"/>
    <!-- Hair Strand Highlight Curves -->
    <path d="M 340 125 Q 300 180 330 240" fill="none" stroke="#2c223a" stroke-width="4"/>
    <path d="M 360 115 Q 325 175 345 220" fill="none" stroke="#2c223a" stroke-width="3"/>
    <path d="M 375 130 Q 355 180 365 210" fill="none" stroke="#2c223a" stroke-width="3"/>

    <!-- 5. ELECTRIC GUITAR — SHREDDING LEAD ROCK GUITAR -->
    <!-- Guitar Group: Angled 38 degrees across torso in classic rock lead pose -->
    <g id="electric-guitar" transform="rotate(-38 350 460)">
      <!-- Guitar Body: Fender Stratocaster / Jazzmaster Double Cutaway Silhouette -->
      <!-- Lower Bout, Waist, Upper Horns -->
      <path d="M 210 400 C 180 340 230 290 280 320 C 300 335 310 360 295 390 C 280 425 310 480 380 480 C 450 480 470 420 455 370 C 440 320 490 280 525 320 C 560 370 545 470 495 540 C 445 610 280 620 230 545 C 200 500 220 440 210 400 Z" 
            fill="url(#guitarBurst)" stroke="#ff3344" stroke-width="3.5" filter="url(#concertGlow)"/>

      <!-- 3-Ply Black Pickguard -->
      <path d="M 270 370 C 290 380 310 410 350 410 C 400 410 420 370 440 360 C 450 400 440 460 400 490 C 330 510 270 470 270 370 Z" 
            fill="#08070d" stroke="#332a42" stroke-width="2"/>

      <!-- Dual Humbucker Pickups with Chrome Poles -->
      <rect x="335" y="390" width="56" height="20" rx="3" fill="#13101c" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <rect x="335" y="425" width="56" height="20" rx="3" fill="#13101c" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <!-- Pickup Magnet Poles -->
      <circle cx="345" cy="400" r="2.5" fill="#ffffff"/>
      <circle cx="355" cy="400" r="2.5" fill="#ffffff"/>
      <circle cx="365" cy="400" r="2.5" fill="#ffffff"/>
      <circle cx="375" cy="400" r="2.5" fill="#ffffff"/>
      <circle cx="345" cy="435" r="2.5" fill="#ffffff"/>
      <circle cx="355" cy="435" r="2.5" fill="#ffffff"/>
      <circle cx="365" cy="435" r="2.5" fill="#ffffff"/>
      <circle cx="375" cy="435" r="2.5" fill="#ffffff"/>

      <!-- Chrome Tremolo Bridge -->
      <rect x="335" y="470" width="56" height="26" rx="4" fill="url(#metalChrome)" stroke="#110d18" stroke-width="1.5"/>
      <circle cx="410" cy="465" r="8" fill="url(#metalChrome)" stroke="#111" stroke-width="1"/>
      <circle cx="400" cy="495" r="8" fill="url(#metalChrome)" stroke="#111" stroke-width="1"/>

      <!-- Maple Neck & Rosewood Fretboard extending upwards -->
      <path d="M 350 390 L 350 -50 L 376 -50 L 376 390 Z" fill="#1c1614" stroke="#4a3832" stroke-width="2"/>
      
      <!-- 24 Metal Frets -->
      <line x1="350" y1="-20" x2="376" y2="-20" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="10" x2="376" y2="10" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="45" x2="376" y2="45" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="85" x2="376" y2="85" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="130" x2="376" y2="130" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="180" x2="376" y2="180" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="235" x2="376" y2="235" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="295" x2="376" y2="295" stroke="url(#metalChrome)" stroke-width="1.5"/>
      <line x1="350" y1="355" x2="376" y2="355" stroke="url(#metalChrome)" stroke-width="1.5"/>

      <!-- Pearl Inlay Dots -->
      <circle cx="363" cy="25" r="3" fill="#ffffff" opacity="0.9"/>
      <circle cx="363" cy="105" r="3" fill="#ffffff" opacity="0.9"/>
      <circle cx="363" cy="205" r="3" fill="#ffffff" opacity="0.9"/>
      <circle cx="359" cy="325" r="2.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="367" cy="325" r="2.5" fill="#ffffff" opacity="0.9"/>

      <!-- Reverse Headstock with 6 Inline Tuners -->
      <path d="M 350 -50 L 335 -140 L 355 -165 L 375 -130 L 376 -50 Z" fill="#0c0a12" stroke="#ff2a3b" stroke-width="2"/>
      <circle cx="340" cy="-60" r="4" fill="url(#metalChrome)"/>
      <circle cx="342" cy="-78" r="4" fill="url(#metalChrome)"/>
      <circle cx="344" cy="-96" r="4" fill="url(#metalChrome)"/>
      <circle cx="346" cy="-114" r="4" fill="url(#metalChrome)"/>
      <circle cx="348" cy="-132" r="4" fill="url(#metalChrome)"/>
      <circle cx="350" cy="-150" r="4" fill="url(#metalChrome)"/>

      <!-- 6 Steel Guitar Strings (Gleaming in Concert Light) -->
      <line x1="353" y1="-140" x2="353" y2="480" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
      <line x1="357" y1="-140" x2="357" y2="480" stroke="#ffffff" stroke-width="1" opacity="0.95"/>
      <line x1="361" y1="-140" x2="361" y2="480" stroke="#ffffff" stroke-width="1.2" opacity="0.95"/>
      <line x1="365" y1="-140" x2="365" y2="480" stroke="#ffffff" stroke-width="1.4" opacity="0.95"/>
      <line x1="369" y1="-140" x2="369" y2="480" stroke="#ffffff" stroke-width="1.6" opacity="0.95"/>
      <line x1="373" y1="-140" x2="373" y2="480" stroke="#ffffff" stroke-width="1.8" opacity="0.95"/>
    </g>

    <!-- 6. FRETTING ARM (Left Arm gripping the angled guitar neck) -->
    <path d="M 270 280 L 175 350 L 165 325 L 230 230 L 260 215 L 285 245 Z" 
          fill="url(#bodyBlackGrad)" stroke="#ff2a3b" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Left Hand Fretting Chords on Neck -->
    <path d="M 160 320 Q 185 295 210 320 Q 190 350 165 340 Z" fill="#2d222e" stroke="#ff3344" stroke-width="1.5"/>

    <!-- 7. STRUMMING ARM (Right Arm bent in full-rock shredding downstroke) -->
    <path d="M 425 280 Q 520 340 485 450 L 420 480 L 405 440 Q 450 380 410 300 Z" 
          fill="url(#bodyBlackGrad)" stroke="#ff2a3b" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Spiked Leather Wristband -->
    <rect x="420" y="445" width="30" height="14" rx="3" fill="#08070d" stroke="#e11d2e" stroke-width="1.5"/>
    <polygon points="426,443 430,449 422,449" fill="url(#metalChrome)"/>
    <polygon points="436,443 440,449 432,449" fill="url(#metalChrome)"/>
    <polygon points="446,443 450,449 442,449" fill="url(#metalChrome)"/>

    <!-- Right Hand with Pick Shredding Strings -->
    <path d="M 415 460 Q 395 480 390 500 Q 415 510 430 480 Z" fill="#2d222e" stroke="#ff3344" stroke-width="1.5"/>
    <!-- Glowing Crimson Tortex Guitar Pick -->
    <polygon points="388,495 398,492 393,504" fill="#ff0033" filter="url(#pickGlow)"/>
  </g>
</svg>
